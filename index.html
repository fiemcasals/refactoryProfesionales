<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma de gestión de turnos de salud para pacientes y profesionales médicos.">
    <title>Profesionales - Gestión de Turnos y Salud</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-viewport">
        <!-- Top App Header -->
        <header class="app-header" id="main-header">
            <div class="header-content">
                <div class="brand-info">
                    <div class="brand-logo" id="brand-logo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                            <path d="M12 5v14"/>
                            <path d="M5 12h14"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="brand-title">Profesionales</h1>
                        <span class="brand-subtitle">Red de Salud & Turnos</span>
                    </div>
                </div>
                <div class="header-status">
                    <span class="status-indicator online"></span>
                    <span class="status-text">Asistente en línea</span>
                </div>
            </div>
        </header>

        <!-- Main Chat Container -->
        <main class="chat-wrapper">
            <div class="chat-card" id="chat-container">
                <!-- Chat Messages Scroll Area -->
                <div class="messages-area" id="messages-list" role="log" aria-live="polite">
                    <!-- Messages will be dynamically rendered here by app.js -->
                </div>

                <!-- Interactive Quick Actions (Buttons) Container -->
                <div class="quick-actions-bar" id="options-container">
                    <!-- Option buttons will be rendered dynamically -->
                </div>

                <!-- Input Footer Area -->
                <footer class="chat-footer">
                    <form class="input-form" id="chat-form" onsubmit="event.preventDefault();">
                        <input 
                            type="text" 
                            id="chat-input" 
                            class="chat-input" 
                            placeholder="Escribe una consulta o selecciona una opción de arriba..." 
                            autocomplete="off"
                        >
                        <button type="submit" id="btn-send" class="btn-send" aria-label="Enviar mensaje">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </form>
                </footer>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
